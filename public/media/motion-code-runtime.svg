    <circle cx="26" cy="26" r="5" fill="#0e7490"/>
    <text x="46" y="33" fill="#26374f" font-family="Consolas, monospace" font-size="17">ZmotionMotionController.cs</text>
    <text x="663" y="33" fill="#59677c" font-family="Consolas, monospace" font-size="15">C#</text>

    <g font-family="Consolas, monospace" font-size="18">
      <g fill="#59677c" text-anchor="end">
        <text x="46" y="98">01</text><text x="46" y="134">02</text><text x="46" y="170">03</text>
        <text x="46" y="206">04</text><text x="46" y="242">05</text><text x="46" y="278">06</text>
        <text x="46" y="314">07</text><text x="46" y="350">08</text><text x="46" y="386">09</text>
        <text x="46" y="422">10</text><text x="46" y="458">11</text>
      </g>
      <g fill="#26374f">
        <text x="68" y="98"><tspan fill="#0e7490">public void</tspan> MoveLinear(AxisGroup group)</text>
        <text x="68" y="134">{</text>
        <text x="92" y="170"><tspan fill="#0e7490">var</tspan> axes = ADDAX(group.AxisList);</text>
        <text x="92" y="206">EnsureBufferedOutput(axes);</text>
        <text x="92" y="242">ZAux_Direct_Move(</text>
        <text x="116" y="278">handle, axes.Count, axes, distance);</text>
        <text x="68" y="314">}</text>
        <text x="68" y="350"><tspan fill="#0e7490">public void</tspan> Stop() =&gt;</text>
        <text x="92" y="386">ZAux_Direct_Single_Cancel(handle, axis, 2);</text>
        <text x="68" y="422"><tspan fill="#0e7490">public void</tspan> EmergencyStop() =&gt;</text>
        <text x="92" y="458">ZAux_Direct_Rapidstop(handle, 2);</text>
      </g>
    </g>
    <rect x="64" y="486" width="628" height="1" fill="#738398"/>
    <text x="68" y="512" fill="#59677c" font-family="Microsoft YaHei UI, sans-serif" font-size="15">普通停止与急停使用不同 SDK 语义，实际响应仍需控制器运行验证</text>
  </g>

