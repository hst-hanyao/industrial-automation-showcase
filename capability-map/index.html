<!doctype html>
<html lang="zh-CN">
  <head><link rel="icon" href="data:,">
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="工业自动化能力展示站：上位机、PLC 官方案例复盘、运动控制与机器视觉。" />
    <meta name="theme-color" content="#ffffff" />
    <title>工业自动化能力图谱</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p role="alert">本展示站需要启用 JavaScript 才能查看能力图谱。</p></noscript>
    <script>
      (function () {
        function showFallback() {
          var host = document.getElementById('root');
          if (!host || host.childElementCount) return;
          var box = document.createElement('section');
          box.className = 'entry-fallback';
          var notice = document.createElement('p');
          notice.textContent = '页面暂时无法加载，请重试。';
          notice.setAttribute('role', 'alert');
          var retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = '重新加载';
          retry.autofocus = true;
          retry.addEventListener('click', function () { location.reload(); });
          box.append(notice, retry);
          host.replaceChildren(box);
        }
        addEventListener('error', function (event) {
          var target = event.target;
          var entryFailed = target && target.tagName === 'SCRIPT' && target.type === 'module';
          var runtimeFailed = typeof ErrorEvent !== 'undefined' && event instanceof ErrorEvent;
          if (entryFailed || runtimeFailed) showFallback();
        }, true);
      })();
    </script>
    <script type="module" src="/src/showcase-entry.tsx"></script>
  </body>
</html>
